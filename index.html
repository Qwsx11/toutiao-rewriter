<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>头条热讯 · 25频道改写工作台</title>
<style>:root{--bg:#f7f8fc;--card:#fff;--bd:#e8ecf2;--p:#4f6ef7;--r:#e63946;--b:#2980b9;--g:#d4a853;--t1:#1a1a2e;--t2:#585878;--t3:#9898b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;font-size:13px}
.app{display:flex;height:100vh}
.sidebar{width:200px;min-width:200px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:10}
.sbh{padding:12px 14px 10px;border-bottom:1px solid var(--bd)}
.sbh h3{font-size:13px;font-weight:700}.sbh p{font-size:9px;color:var(--t3);margin-top:2px}
.cat-nav{flex:1;overflow-y:auto;padding:4px 0}
.cat-item{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;font-size:11px;color:var(--t2);transition:.12s;user-select:none}
.cat-item:hover{background:#eef1ff;color:var(--p)}.cat-item.active{background:#eef1ff;color:var(--p);font-weight:600}
.cat-item .ci{font-size:13px;width:18px}
.cat-item .cn{margin-left:auto;font-size:9px;background:var(--bg);padding:1px 7px;border-radius:8px;color:var(--t3)}
.sf{padding:8px 14px;border-top:1px solid var(--bd);font-size:9px;color:var(--t3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:9px 18px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;min-height:40px}
.topbar h2{font-size:14px;font-weight:700}.topbar em{font-size:10px;color:var(--t3)}
.content{flex:1;overflow-y:auto;padding:12px}
.list-table{width:100%;border-collapse:collapse;font-size:12px}
.list-table th{text-align:left;padding:9px 10px;background:#fafbfd;border-bottom:2px solid var(--bd);font-size:10px;color:var(--t3);font-weight:600;position:sticky;top:0;z-index:5}
.list-table td{padding:10px;border-bottom:1px solid #f0f0f5;vertical-align:middle}
.list-table tr:hover td{background:#fafbff}.list-table tr{cursor:pointer}
.rank{width:36px;font-weight:900;font-size:14px;text-align:center}.r1{color:var(--r)}.r2{color:#e67e22}.r3{color:var(--g)}
.title-cell{max-width:280px;font-weight:500;line-height:1.35}
.stat{font-size:10px;color:var(--t3);white-space:nowrap}.stat b{color:var(--t2)}
.btn-sm{padding:4px 10px;border:0;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;margin:1px}.btn-gen{background:var(--p);color:#fff}.btn-visit{background:var(--bg);color:var(--p);text-decoration:none;display:inline-block}.btn-gen:hover{opacity:.85}
.detail-panel{position:fixed;top:0;right:-520px;width:520px;max-width:94vw;height:100vh;background:var(--card);border-left:1px solid var(--bd);z-index:100;overflow-y:auto;transition:right .25s ease;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.detail-panel.show{right:0}
.detail-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:99;display:none}.detail-backdrop.show{display:block}
.detail-head{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:5}
.detail-head h3{font-size:13px}
.detail-close{width:28px;height:28px;border:1px solid var(--bd);background:var(--card);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.detail-body{padding:16px 18px}
.detail-body h1{font-size:20px;font-weight:900;line-height:1.35;margin-bottom:10px}
.detail-meta{font-size:10px;color:var(--t3);margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.detail-stats{display:flex;gap:16px;margin-bottom:16px}
.detail-stats .st{text-align:center;padding:8px 14px;background:#fafbfd;border-radius:8px;min-width:70px}
.detail-stats .st b{display:block;font-size:16px;font-weight:900;color:var(--t1)}
.detail-stats .st span{font-size:9px;color:var(--t3)}
.detail-article{font-size:13px;line-height:1.85;color:var(--t2);margin-bottom:18px}
.detail-article p{margin-bottom:10px}
.detail-actions{display:flex;gap:8px;margin-bottom:20px}
.detail-actions button,.detail-actions a{padding:10px 20px;border:0;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.detail-actions .gen{background:var(--p);color:#fff}.detail-actions .gen:hover{opacity:.9}
.detail-actions .visit{background:var(--r);color:#fff}.detail-actions .visit:hover{opacity:.9}
.rewrite-output{padding:16px;background:#fafbfd;border-radius:10px;border:1px solid var(--bd);margin-top:12px;display:none}
.rewrite-output.show{display:block}
.rewrite-output h2{font-size:18px;font-weight:800;margin-bottom:12px}
.rewrite-output .rop{font-size:13px;line-height:1.9;color:var(--t2);margin-bottom:10px}
.rewrite-output .rop.em{font-size:15px;font-weight:600;color:var(--t1)}
.sim-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:600;margin-left:8px}
.sim-ok{background:#e8f8f0;color:#2ecc71}.sim-warn{background:#fff3cd;color:#e67e22}
.spin-s{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;padding:9px 22px;border-radius:18px;font-size:11px;z-index:200;pointer-events:none;display:none}.toast.show{display:block}
.copy-bar{display:flex;gap:8px;margin-top:8px}
.copy-bar button{padding:7px 14px;border:0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
@media(max-width:768px){.sidebar{display:none}.detail-panel{width:100vw}}

function padArts(id,name,icon){
  if(base[id])return;
  var a=[];var topics=[name+'今日热点速递',name+'领域最新动态',name+'深度解读与趋势分析','盘点'+name+'重大事件','一周'+name+'要闻回顾',name+'排行榜TOP10','权威解读'+name+'最新政策','聚焦'+name+'产业变革','独家剖析'+name+'行业现象','大数据揭秘'+name+'新趋势'];
  for(var i=1;i<=10;i++){a.push({t:topics[i-1]+' #'+i,r:Math.floor(Math.random()*800000)+80000,c:Math.floor(Math.random()*6000)+800,z:Math.floor(Math.random()*10000)+1500,u:'https://www.toutiao.com/?category='+id,f:'今日头条'+name+'频道精选内容。涵盖'+name+'领域最新动态与深度分析。每天数亿用户在头条获取资讯。点击访问原文查看完整报道。'});}
  base[id]=a;
}
CATS.forEach(function(c){padArts(c.id,c.name,c.icon)});

function getArts(id){return base[id]||[]}
var curCat='hot',curArt=null;
function renderNav(){
  var h='';CATS.forEach(function(c){h+='<div class="cat-item'+(c.id===curCat?' active':'')+'" data-cat="'+c.id+'"><span class="ci">'+c.icon+'</span>'+c.name+'<span class="cn">10</span></div>'});

}
function fmtN(n){if(n>=10000)return (n/10000).toFixed(1)+'万';return n+''}
function renderTab(){
  var arts=getArts(curCat);var h='<table class="list-table"><thead><tr><th>#</th><th>标题</th><th style="text-align:center">阅读</th><th style="text-align:center">评论</th><th style="text-align:center">转发</th><th>操作</th></tr></thead><tbody>';
  arts.forEach(function(a,i){var rk=i+1,rc=rk===1?'r1':rk===2?'r2':rk===3?'r3':'';h+='<tr data-idx="'+i+'"><td class="rank '+rc+'">'+rk+'</td><td class="title-cell">'+a.t+'</td><td class="stat"><b>'+fmtN(a.r)+'</b></td><td class="stat"><b>'+fmtN(a.c)+'</b></td><td class="stat"><b>'+fmtN(a.z)+'</b></td><td style="white-space:nowrap"><button class="btn-sm btn-gen" data-action="gen" data-idx="'+i+'">✍️改写</button> <button class="btn-sm btn-visit" data-action="visit" data-idx="'+i+'">🔗访问</button></td></tr>'});

    showPanel()}})}
function showPanel(){if(!curArt)return;var h='<div class="detail-head"><h3>文章详情</h3><button class="detail-close" onclick="closePanel()">✕</button></div><div class="detail-body"><h1>'+curArt.t+'</h1><div class="detail-meta">📂 '+curCat+' · 📅 2026.05.30</div><div class="detail-stats"><div class="st"><b>'+fmtN(curArt.r)+'</b><span>阅读</span></div><div class="st"><b>'+fmtN(curArt.c)+'</b><span>评论</span></div><div class="st"><b>'+fmtN(curArt.z)+'</b><span>转发</span></div></div><div class="detail-article">'+curArt.f.split('\n').filter(function(p){return p.trim()}).map(function(p){return'<p>'+p+'</p>'}).join('')+'</div><div class="detail-actions"><button class="gen" onclick="doRewrite()">✍️ 生成改写</button><a class="visit" href="'+curArt.u+'" target="_blank">🔗 访问原文</a></div><div class="rewrite-output" id="rwOut"></div></div>';$('detail').innerHTML=h;$('detail').classList.add('show');$('backdrop').classList.add('show')}
