{t:'特朗普结束访华，中美同意启动AI政府间对话机制',r:5862000,c:42000,z:89000,u:'https://www.toutiao.com/',f:'美国总统特朗普于2026年5月13日至15日对中国进行国事访问。这是自2017年以来，时隔整整九年，第一个在任美国总统踏上中国土地。\n\n和他一起飞过来的不是标准的外交团队。同行名单上有英伟达CEO黄仁勋，苹果CEO蒂姆·库克，还有特斯拉的高管。这三家公司在全球半导体、消费电子和新能源汽车领域的分量不需要多解释。\n\n五天行程敲定的重大成果之一，是双方同意正式建立人工智能领域的政府间对话机制。多家国际媒体用同一个词来形容这件事："里程碑式的。"在这之前，全球最大的两个AI超级大国在这个领域一直没有结构性沟通渠道。\n\n资本市场在访问前后给出了直接反馈。英伟达股票持续走高，市值一度站上5.5万亿美元大关。黄仁勋本人账面财富膨胀到1625亿美元，在全球富豪榜上位居第八。\n\n分析人士普遍认为，这次访问的"科技含量"远超此前任何一次美国总统访华。随行企业本身就是一份美方科技力量的浓缩清单，而达成的AI对话机制则意味着双方终于承认了一个现实：在人工智能这件事上，单方面制定游戏规则已经行不通了。'},
{t:'普京第25次访华，专车车牌暗藏中国文化密码',r:4230000,c:38000,z:72000,u:'https://www.toutiao.com/',f:'2026年5月19日傍晚，一架俄罗斯专机在北京首都国际机场着陆。普京走出来的时候，距离他上一次站在中国土地上不过几个月。这是他第25次以总统身份访华，恰好扎在中俄战略协作伙伴关系建立三十周年的时间节点上。\n\n当晚一个细节被各家媒体反复拿出来说。普京搭乘的那辆专车挂上了一面中国号牌，车里藏了三个"8"。在中国文化里，8念作"发"——从商周时代的礼制到现代人的车牌选号，几千年来这个数字一直是顶格的好兆头。给来访的外国元首布置这样一块车牌，一定不是抽签抽出来的。\n\n下车之前他做了一个动作：把西装外套脱下来搭在手上。就这一个动作，第二天社交媒体的评论区变成了"微表情学家"的辩论场。有人说是态度松弛，有人说这是对中方接待的完全信赖，也有人觉得——他就是热了。\n\n正式闭门会谈安排在5月20日。习近平和普京隔着长桌谈了不到半天，最后签出了23份合作文件，涵盖能源、科技和安全。具体条款大部分没有公开，但数量本身就足以说明问题。普京本人对媒体用了一句话收尾："俄中关系正处在史无前例的高点。"\n\n有意思的是，就在大约一个礼拜之前，另一位大国领导人——特朗普——刚刚从同一座城市飞走。中美俄三国元首在不到十天的时间里相继亮相北京，对话、签约、离场。外媒把这十天称为"北京外交季"。'},
{t:'22岁吴宜泽18比17绝杀肖恩墨菲，摘下斯诺克世锦赛桂冠',r:3890000,c:56000,z:104000,u:'https://www.toutiao.com/',f:'北京时间5月25日深夜，英国谢菲尔德市的克鲁斯堡剧院里，空气重得像能拧出水来。\n\n斯诺克世锦赛决赛打到第十七盘的时候，比分牌定格在17比17。全场都知道这意味着什么——下一盘谁拿下谁就是世界冠军。\n\n球桌一头坐着的男人叫肖恩·墨菲，拿了英锦赛、大师赛和世锦赛全套大满贯，在这个圈子里沉沉浮浮二十年，什么场面都见过。另一头坐着的中国小伙子还没过23岁生日。名字叫吴宜泽。\n\n他弯腰瞄球的时候，全世界的摄像机都在找他的手。然后他打出了整场比赛最干净的一杆清台。放下球杆之后他笑了笑，那种笑明显不是刻意控制出来的——是根本没压住的那种。\n\n斯诺克世锦赛从创办到现在，这是头一次诞生00后世界冠军。去年捧杯的赵心童也是中国面孔。换句话说，中国选手在这项运动最高殿堂里已经连续两年把奖杯端回亚洲了。\n\n很多人条件反射般地想起另一个中国人——丁俊晖。2005年他18岁拿下中国公开赛时，斯诺克拿国内市场来说，妥妥的小众冷门。丁俊晖追了一整个职业生涯的世锦赛金杯始终没能到手，2016年决赛输给塞尔比那场尤其让人心里堵得慌。而现在两个00后替他把没圆的梦给圆了。\n\n夺冠之后吴宜泽在直播里随口聊了一堆：身高一米八五，平常私下跟丁俊晖一块吃饭一块研究球路，网球挺郑钦文，平时看曼联比赛，歌单里最多的是陈奕迅。记者问新赛季目标，他语气跟说明早吃面一样："争取世界第一。"'}];
FULL.intl=[{t:'伊朗封锁霍尔木兹海峡走进第84天，全球油价150美元警报拉响',r:2670000,c:51000,z:93000,u:'https://www.toutiao.com/',f:'霍尔木兹海峡最窄那一段只有33公里宽。但就是这三十多公里的一线水道，每天流经的原油量占全球海运总量的五分之一还多——大约1500万桶到2000万桶。如今这条水道已经堵了整整十二周。\n\n从2月28日美国和以色列联军对伊朗发动第一轮军事打击算起，到此刻恰好84天。海峡目前的实际通行量只有正常水平的百分之十二，几乎处于闭锁状态。\n\n国际能源署给出的累计算法是触目惊心的：海峡封锁至今，全球原油供应损失累计超过10亿桶。储备库存每天以480万桶左右的速度被消耗掉，单单三月和四月两个月就合计跌掉了近2.5亿桶。\n\n5月最后一周连着出了两件让资本市场头皮发麻的事。26号美国空军对伊朗南部进行了新一轮空袭。两天后伊朗用弹道导弹远程打击了美军在伊拉克的空军基地。布伦特原油期货在99美元上下剧烈震荡。但真正让所有投行的分析师夜不能寐的，不是现在挂出来的牌价——而是那个还没碰到但越来越近的临界水位。\n\n埃克森美孚5月28日发了一份措辞罕见的预警，大意是：一旦全球储备库存滑落到最低运营水位线以下，布伦特油价不会有序上涨。它会跳涨。直接冲破150美元并有可能继续探到160美元。摩根士丹利和花旗给出的预测区间基本重叠。\n\n美伊核谈桌上看似还在走流程，但伊朗开出的牌单又长又硬：120亿美元冻结资产的完整使用权、所有制裁一次撤干净、美方对战争造成的经济损失进行赔付。美方这边的出牌是把所有这些条件打包成一个全面框架协议。荷兰合作银行做了一项测算：哪怕明天就谈成签字，光是扫清水雷、打捞阻塞物、等航运公司重新评估通过海峡的风险——这些流程全部走完也少说要三个月。海峡真正复产通油很难在夏天结束前看到。'}];
FULL.tech=[{t:'比亚迪推出璇玑A3，中国第一款4纳米车规级智驾芯片',r:2980000,c:41000,z:78000,u:'https://www.toutiao.com/',f:'5月28日晚上，王传福站在深圳坪山总部的主舞台上，手里攥着一块指甲盖大小的黑色芯片。台下安静了整整三秒，然后全场站起来鼓掌。这就是璇玑A3——中国第一款4纳米车规工艺的自动驾驶芯片。\n\n4纳米这几个字放在消费电子行业不算新鲜词，手机芯片已经跑到了3纳米。但请注意"车规级"这个前缀。车载芯片要求在零下四十度到一百五十度的极端环境里稳定运行十年以上，要通过ISO 26262功能安全标准的最高认证。王传福自己给了一句话来概括难度："车规4纳米约等于消费电子2纳米。"\n\n璇玑A3配置如下：16核CPU，内置3个NPU计算单元，原生支持Transformer架构的大模型推理。单颗算力约700TOPS，三颗并联可以冲到2100TOPS以上。单位算力功耗相对于同级别的外采方案低了约两成。\n\n这张芯片最大的商业意义不是跑分，而是比亚迪终于实现了"软硬件一体化"。在此之前智驾系统用的要么是英伟达Orin系列，要么是地平线征程系列，OTA版本迭代节奏不完全由自己说了算。现在芯片和算法都在自己手里攥着。\n\n同一场发布会上甩出来的配套政策比芯片本身更让消费者兴奋：高阶智驾选装一口价一万两千块，连七万级别的入门电动小车都能配上带激光雷达的城市领航功能。更狠的是城市领航全责兜底一年——在合规使用的前提下出了有责事故，比亚迪全额赔付，不计入车主个人商业险记录，不影响下一年的保费。\n\n很多人不知道比亚迪做芯片的历史。2002年比亚迪就成立了集成电路设计部门，粗算到今天已经做了二十四年。现在晶圆制造和封装测试加起来有五座工厂，芯片研发人员超过七千人。从第一颗到第五千多颗，全系累计研发砸进去超过一千亿。'},
{t:'蓝色起源新格伦火箭点火测试中爆炸，美国重返月球被迫再延',r:3120000,c:45000,z:87000,u:'https://www.toutiao.com/',f:'美国东部时间5月28日晚上九点前后，卡纳维拉尔角太空基地的夜空突然变成了诡异的橙红色。不是晚霞。是爆炸。\n\n蓝色起源的新格伦重型运载火箭按计划执行一次静态点火测试，7台BE-4液氧甲烷发动机按程序应该持续工作十二秒。结果点火后不到三秒，火焰沿箭体侧壁蹿上去——然后就是一声巨响，整个火箭被一团橙红色的火球从中间吞进去。发射台右侧的四座防雷塔之一直接断掉。远在一百八十五公里外的民居有人打911说天上有光在闪。\n\n新格伦火箭总高九十八米，差不多二十九层居民楼摞起来。取这个名字是为了致敬美国第一个完成轨道飞行任务的宇航员约翰·格伦。蓝色起源从头到尾往这个项目里灌了大约一百二十亿美金，前后耗时将近十年。它的下一个飞行窗口本来定在6月4号，准备替亚马逊的柯伊伯计划把48颗低轨宽带卫星送进轨道。现在卫星得重新找发射商。\n\n但真正让事情变得棘手的是NASA那边。蓝色起源是美国阿尔忒弥斯重返月球计划仅有的两家载人登月着陆器主承包商之一——另一家是SpaceX。原先的计划表是在2027年执行阿尔忒弥斯三号任务进行首次载人登月。但新格伦现在至少要停飞六个月以上，发射台的维修费保守估计要烧掉十亿美金。最乐观的评估是，重返月球的时间轴至少被推到2030年以后。\n\n一个更揪心的大背景：今年4月新格伦刚出过一次二级发动机推力不足的重大故障，导致价值数亿的卫星直接坠入大气层。联邦航空管理局熬到5月22号才勉强批准复飞。复飞后第六天，它就炸了。贝索斯发了一份很短的声明："今天极其艰难。但我们会重建，然后重新升空。"'}];
