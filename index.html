<style>:root{--bg:#f7f8fc;--card:#fff;--bd:#e8ecf2;--p:#4f6ef7;--r:#e63946;--b:#2980b9;--g:#d4a853;--pp:#8e44ad;--gr:#27ae60;--t1:#1a1a2e;--t2:#585878;--t3:#9898b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;font-size:13px}
.app{display:flex;height:100vh}
.sidebar{width:200px;min-width:200px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:10}
.sbh{padding:12px 14px 8px;border-bottom:1px solid var(--bd)}.sbh h3{font-size:13px;font-weight:700}.sbh p{font-size:9px;color:var(--t3);margin-top:1px}

.cat-item .ci{font-size:13px;width:18px}.cat-item .cn{margin-left:auto;font-size:9px;background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--t3)}
.sf{padding:8px 14px;border-top:1px solid var(--bd);font-size:9px;color:var(--t3);display:flex;justify-content:space-between;align-items:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:9px 18px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;min-height:40px}

.list-table th{text-align:left;padding:9px 10px;background:#fafbfd;border-bottom:2px solid var(--bd);font-size:10px;color:var(--t3);font-weight:600;position:sticky;top:0;z-index:5}
.list-table td{padding:10px;border-bottom:1px solid #f0f0f5;vertical-align:middle}

.rw-block .rw-h2{font-size:16px;font-weight:700;color:var(--r);margin:28px 0 10px;padding-left:12px;border-left:4px solid var(--r)}

.rw-block .rw-p{font-size:14px;line-height:1.95;color:var(--t2);margin-bottom:12px}
.rw-block .rw-em{font-size:16px;font-weight:600;color:var(--t1);margin:18px 0}
.rw-block .rw-short{font-size:18px;font-weight:800;color:var(--t1);margin:22px 0;text-align:center}
.rw-block .rw-data{margin:16px 0;padding:16px;background:#fafafa;border-radius:8px;border:1px solid var(--bd);display:flex;gap:12px;flex-wrap:wrap}
.rw-block .rw-data .di{flex:1;min-width:55px;text-align:center}.rw-block .rw-data .dn{font-size:24px;font-weight:900;color:var(--r);font-family:Georgia,serif}.rw-block .rw-data .dl{font-size:9px;color:var(--t3);margin-top:2px}
.rw-block .rw-quote{margin:18px 0;padding:14px 18px;background:#faf8f5;border-radius:6px;border-left:4px solid var(--g);font-size:14px;color:var(--t2);font-style:italic}
.rw-block .rw-footer{text-align:center;color:var(--t3);font-size:11px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
.copy-bar2{display:flex;gap:8px;margin-top:12px}.copy-bar2 button{padding:8px 16px;border:0;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.retry-msg{padding:10px 14px;border-radius:6px;font-size:11px;margin-top:8px;display:none}.retry-msg.show{display:block}.retry-msg.w{background:#fff3cd;color:#e67e22}
.spin-s{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;padding:9px 22px;border-radius:18px;font-size:11px;z-index:200;pointer-events:none;display:none}.toast.show{display:block}
@media(max-width:768px){.sidebar{display:none}.detail-panel{width:100vw}}

FULL.hot=[
{t:'特朗普一个月内结束访华，中美同意开展AI政府间对话',r:5862000,c:42000,z:89000,u:'https://www.toutiao.com/',f:'美国总统特朗普于2026年5月13日至15日对中国进行国事访问。这是自2017年以来，时隔整整九年，首位在任美国总统踏上中国土地。\n\n与他同行的不是普通的外交团队，而是美国科技界最有权势的一批人。英伟达掌门黄仁勋、苹果首席执行官库克以及特斯拉方面的负责人均在随行名单中。这三家公司在全球半导体、消费电子和新能源汽车领域的份量，不需要我再多解释。\n\n五天行程里，双方敲定的最核心成果是一项共识——正式启动人工智能领域的政府间对话机制。多家外媒用了同一个词来形容这件事："里程碑式的。"在此之前，全球两个AI超级大国在这个领域一直缺乏结构性的沟通渠道。\n\n访问前后资本市场给出了直接反馈。英伟达股价持续走高，市值一度站上5.5万亿美元大关。黄仁勋本人的账面财富随之膨胀到1625亿美元，在全球富豪榜上排在第八位。\n\n分析人士普遍认为这次访问的"科技属性"远超以往任何一次美国总统访华。随行企业名单本身就是一份美国科技霸权的缩影，而达成的AI对话机制则意味着双方终于承认了一个现实：在人工智能这个问题上，单方面制定规则已经行不通了。'},{t:'俄罗斯总统普京第25次访华，专车车牌含三个"8"',r:4230000,c:38000,z:72000,u:'https://www.toutiao.com/',f:'2026年5月19日傍晚，一架专机降落在北京首都国际机场。走出来的人是普京。这是他第25次以俄罗斯总统身份踏上中国土地，恰好赶在中俄战略协作伙伴关系建立三十周年的节点上。\n\n当晚的一个细节被媒体反复提及。普京乘坐的专车挂上了一面中国号牌，号码里面有三个"8"。在中国文化语境里，8的发音通"发"，是沿袭了上千年的吉祥数字。给一个外国元首安排这样一块车牌，不是随机的。\n\n下车之前他做了一个动作：脱掉了西装外套。就是这一个动作，让第二天所有社交媒体的评论区都变成了"细节控"的狂欢。有人解读为态度松弛，有人说这是对中方接待的完全信任，也有人觉得他就是热了。\n\n正式会谈安排在5月20日。习近平与普京面对面坐了几个小时，最后签署了23份合作文件。能源、科技、安全——这三个领域的合作深度超出了大多数外界的预期。普京本人对媒体说了一句被反复引用的话："俄中关系正处于前所未有的高水平。"\n\n值得一提的是，此前一个礼拜特朗普刚刚离开北京。中美俄这三个大国的元首在不到十天的时间里先后出现在同一个城市，对话、签约、离开。国际媒体称之为"北京外交季"。'},{t:'22岁吴宜泽18∶17绝杀肖恩·墨菲，勇夺斯诺克世锦赛冠军',r:3890000,c:56000,z:104000,u:'https://www.toutiao.com/',f:'北京时间5月25日深夜，英国谢菲尔德克鲁斯堡剧院。\n\n斯诺克世锦赛决赛打到了第17局。比分牌上的数字让所有人都屏住了呼吸：17比17。谁拿下最后一局，谁就是世界冠军。\n\n球桌的一边坐着的是肖恩·墨菲，英锦赛、大师赛、世锦赛三大赛全满贯得主，在斯诺克领域摸爬滚打了二十年。另一边是一个22岁的中国少年，名字叫吴宜泽。\n\n他弯腰瞄准的时候，全世界的镜头都对着他的手。然后他打出了职业生涯最干净的一杆清台。把手里的球杆轻轻放在桌边之后，露出的笑还有点害羞。\n\n这是斯诺克世锦赛历史上诞生的第一位00后冠军。去年捧杯的赵心童也是中国面孔，也就是说中国球员已经连续两年把这座奖杯留在了自己手里。\n\n很多人马上想到了另外一个人——丁俊晖。2005年他18岁拿下中国公开赛时，斯诺克在中国还是小众运动。丁俊晖追了整个职业生涯的世锦赛冠军始终差了一步，2016年决赛输给塞尔比那一次尤其令人惋惜。而现在，赵心童和吴宜泽这两个00后替他把没实现的梦圆了。\n\n吴宜泽赛后直播时聊了很多：身高185，私下跟丁俊晖一起吃饭一起学习，网球支持郑钦文，喜欢曼联和德约科维奇。新赛季的目标，他说得很平静——"争取世界第一。"'}];
FULL.tech=[{t:'比亚迪发布璇玑A3：中国第一款4纳米车规级智驾芯片',r:2980000,c:41000,z:78000,u:'https://www.toutiao.com/',f:'5月28日晚上，王传福站在深圳比亚迪全球总部的舞台上，手里拿着的芯片只有指甲盖大小。这就是璇玑A3——中国第一款车规级4纳米制程的智能驾驶芯片。\n\n4纳米是什么概念。放在消费电子领域，这已经是目前最先进的量产制程之一。但车规级芯片面临的环境远比分手机严苛，零下四十度到一百五十度的极端温度下必须稳定运行十年以上。王传福自己说了一句话概括难度："车规4纳米等于消费电子2纳米。"\n\n芯片的配置是16核CPU配上3核NPU，原生支持Transformer大模型。单颗算力大约700TOPS，三颗并联能冲到2100TOPS以上。关键还在于功耗控制——比同级竞品低了大约两成。\n\n从商业角度看这张芯片最大的意义是比亚迪实现了"软硬一体"。以前智驾系统用的是英伟达或地平线的芯片，系统OTA升级得看供应商脸色。现在芯片和算法都是自家的。\n\n配合璇玑A3一起发布的还有两大让消费者直接受益的政策。高阶智驾选装统一定价一万两千块，连入门级的小轿车都能配上带激光雷达的城市领航。更重要的是城市领航全责兜底一年——合规使用期间出事比亚迪全额赔，不计入个人车险，不影响下一年保费。\n\n比亚迪做芯片不是新手。2002年就组建了IC设计部，现在有超过7000人的芯片研发团队。二十四年时间的持续投入，垒出了2000多款芯片产品，被46个汽车品牌采用。累计研发投入超过1000亿。'},{t:'蓝色起源"新格伦"火箭点火测试爆炸，美国登月再度推迟',r:3120000,c:45000,z:87000,u:'https://www.toutiao.com/',f:'5月28日晚，美国佛罗里达州卡纳维拉尔角的天空突然变成了橘红色。\n\n蓝色起源公司的新格伦重型运载火箭固定在发射台上进行常规的静态点火测试，计划点燃7台BE-4发动机持续12秒。结果刚到第3秒，火焰沿箭体侧面蹿升，随即一声巨响，整个火箭被火球吞没。发射台右侧的防雷塔直接炸塌了。185公里外的居民打电话报警说看到天边在发光。\n\n新格伦火箭高达98米，相当于29层居民楼。名字源于美国第一位完成轨道飞行的宇航员约翰·格伦。研发前前后后砸进去120亿美金，耗时近十年。原定6月4日执行第四次商业发射任务，为亚马逊的柯伊伯卫星计划送48颗低轨宽带卫星入轨。现在这些卫星得重新找火箭了。\n\n更棘手的问题出在NASA那边。蓝色起源是阿尔忒弥斯重返月球计划的两家登月着陆器主承包商之一，另一家是马斯克的SpaceX。原先的规划是2027年启动阿尔忒弥斯三号任务进行首次载人登月。但现在看来至少要推迟到2030年之后。\n\n火箭今年4月才经历过一次二级发动机故障导致卫星坠毁。联邦航空管理局5月22日刚刚批准复飞，仅仅6天之后就发生了这次爆炸。发射台修复保守估计要花六个月和超过10亿美元。贝索斯的回应很短也很沉："今天非常难。但我们会重建，然后重新飞起来。"'}];
FULL.intl=[{t:'伊朗封锁霍尔木兹海峡走进第十二周，全球油价150美元预警拉响',r:2670000,c:51000,z:93000,u:'https://www.toutiao.com/',f:'霍尔木兹海峡已经堵了十二个星期。\n\n这条宽度最窄处只有33公里的水道，承载着全球超过五分之一的原油海运量，每天大约1500万到2000万桶。现在通行量只剩原来的12%，海峡几乎处于关停状态。从今年2月最后一天美以联军对伊朗发动首轮打击算起，掐指一算已经整整84天。\n\n国际能源署给出的总账是触目惊心的：因海峡封锁损失的原油供应累计超过了10亿桶。全球库存以每天大约480万桶的速度在消耗，三到四月的两个月里合计下降了将近2.5亿桶。\n\n5月最后一周发生了两件让市场心惊的事。5月26号美国对伊朗南部进行了新一轮空袭。两天之后伊朗用导弹回敬了美军在伊拉克的基地。布伦特原油期货价格在99美元上下来回震荡，但真正让所有投行紧张的不是现在这个价——而是还没触及但已经近在眼前的那个临界点。\n\n埃克森美孚5月28号发了一份预警，措辞毫不含糊：一旦全球库存跌到最低运营水位线以下，布伦特油价不会慢慢涨上去。它会跳涨，直接突破150美元可能摸到160美元。摩根士丹利和花旗的预测方向完全一致。\n\n美伊核谈表面上还在推进，但伊朗开出的条件清单非常长——120亿美元冻结资产的全面使用权、所有制裁必须一次性解除、美方对战争损失进行赔偿。美方的态度则是把这些条件跟全面协议打包处理。双方的期望值之间隔着一条肉眼可见的鸿沟。荷兰合作银行的测算显示，就算明天谈成了也得再花三个月才能把海峡真正恢复畅通。扫雷、沉船清理、航运公司重新评估风险，没有一项能在短时间内搞定。'}];
